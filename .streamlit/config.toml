# Dunkles Basis-Theme – passt zum Glas-Look mit Hintergrundbild.
# Farben kannst du frei anpassen (Hex-Codes).
[theme]
base = "dark"
primaryColor = "#2bd4d9"            # türkiser Akzent (Buttons, Links)
# Seitenfläche. Früher lag hier ein Foto darüber und dieser Wert war nur der
# Fallback dahinter; seit das Foto weg ist, IST das die Fläche der Seite.
# #02162b statt vorher #0a2540, weil die gläsernen Kacheln halbtransparent sind
# und einen dunklen, ruhigen Grund brauchen, um überall gleich zu wirken.
backgroundColor = "#02162b"
secondaryBackgroundColor = "#11385c"
textColor = "#eaf4ff"

[server]
# Produktion: kein Datei-Watcher (spart Speicher/CPU) und ein kleineres Upload-
# Limit (Fotos/FIT sind klein) -> schuetzt die 512-MB-Instanz vor Riesen-Uploads.
fileWatcherType = "none"
maxUploadSize = 25

[browser]
gatherUsageStats = false
